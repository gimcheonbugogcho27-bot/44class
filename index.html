<!DOCTYPE html>

<head>

      align-items: center;
      gap: 8px;

      display: flex;
      gap: 10px;

      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-btn:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: #38bdf8;
      transform: translateY(-2px);
    }

    .nav-btn.active {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      border-color: #38bdf8;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);

    /* 메인 선택 홈 화면 */
    .portal-home {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      text-align: center;
    }

    .portal-title {
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #38bdf8 0%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
    }

    .portal-subtitle {
      color: #94a3b8;
      font-size: 1.05rem;
      margin-bottom: 45px;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 360px));
      gap: 30px;
      width: 100%;
      max-width: 800px;
      justify-content: center;

    .program-card {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(56, 189, 248, 0.3);

      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow: hidden;

    .program-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; height: 4px;
      background: linear-gradient(90deg, #38bdf8, #a78bfa);
      opacity: 0;
      transition: opacity 0.3s;

    .program-card:hover {
      transform: translateY(-8px);
      border-color: #38bdf8;
      box-shadow: 0 12px 40px rgba(56, 189, 248, 0.3);
    }

    .program-card:hover::before {
      opacity: 1;
    }

    .card-icon {
      font-size: 3.5rem;
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 12px;
    }

    .card-desc {
      font-size: 0.92rem;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .enter-btn {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #fff;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 0 12px rgba(2, 132, 199, 0.3);
    }

    .enter-btn:hover {
      background: linear-gradient(135deg, #0369a1 0%, #0284c7 100%);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
    }

    /* 프로그램 화면 출력용 iframe */
    .app-viewport {
      flex: 1;
      width: 100%;
      height: calc(100vh - 60px);
      border: none;
      display: none;
    }
  </style>
</head>
<body>

  <!-- 상단 내비게이션 -->
  <header>
    <div class="logo" onclick="showHome()">

  <iframe id="appFrame" class="app-viewport"></iframe>

  <script>

    const assetHtmlSrc = `<!DOCTYPE html>

    h1, h2 { text-align: center; margin-bottom: 20px; font-size: 1.5rem; font-weight: 700; letter-spacing: 0.5px; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }

    .table-wrapper { max-height: 480px; overflow-y: auto; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.2); }
    .table-wrapper::-webkit-scrollbar { width: 6px; }
    .table-wrapper::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.3); border-radius: 10px; }

    th { position: sticky; top: 0; background: rgba(74, 84, 157, 0.9); backdrop-filter: blur(5px); font-weight: 700; }
    tr:hover { background: rgba(255, 255, 255, 0.1); }
    .admin-tag { background: rgba(255, 193, 7, 0.3); padding: 2px 6px; border-radius: 6px; font-size: 0.75rem; border: 1px solid rgba(255, 193, 7, 0.5); }

</head>
<body>
  <div class="app-container">
    <div class="glass-card">
      <h1>4-4반 자산 등록</h1>
      <form id="assetForm">
        <div class="form-group"><label for="studentName">이름 선택</label><select id="studentName" required><option value="" disabled selected>학생 이름을 선택하세요</option></select></div>
        <div class="form-group"><label for="transactionType">구분 선택</label><select id="transactionType" required onchange="updateCategoryOptions()"><option value="" disabled selected>자산추가 또는 차감을 선택하세요</option><option value="add">자산추가 (+)</option><option value="subtract">차감 (-)</option></select></div>
        <div class="form-group"><label for="category">상세 항목</label><select id="category" required disabled><option value="" disabled selected>구분을 먼저 선택하세요</option></select></div>

    </div>
    <div class="glass-card">
      <div class="table-header">
        <h2>학생별 자산 현황표</h2>
        <div class="table-tools">
          <input type="text" id="searchInput" class="search-input" placeholder="이름 검색..." oninput="filterTable()">
          <button type="button" class="btn-reset" onclick="resetAllData()">초기화</button>
        </div>
      </div>
      <div class="table-wrapper">
        <table>
          <thead><tr><th>번호</th><th>이름</th><th>현재 자산</th></tr></thead>
          <tbody id="assetTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>
  <script>
    const STORAGE_KEY = "class4_4_assets_data";
    const studentList = ["김예은", "김윤솔", "김재은", "나헤지", "박솔아", "박주아", "박준희", "송지아", "신다원", "전소현", "전시은", "주예진", "김규담", "김성현", "김지유ADMIN님", "김혜준", "박서한", "박우준", "신유찬", "안재현", "이서빈", "이승운", "이시우", "장재훈", "전지훈", "정유재"];
    let studentAssets = {};
    const categoryData = { add: ["월급", "QUIZ", "미션", "선생님보너스"], subtract: ["적금예금", "뽑기", "간식", "자리배정"] };
    window.onload = function() { initData(); initStudentSelect(); renderAssetTable(); };
    function initData() {
      const savedData = localStorage.getItem(STORAGE_KEY);
      if (savedData) {
        studentAssets = JSON.parse(savedData);
        studentList.forEach(name => { if (studentAssets[name] === undefined) studentAssets[name] = 0; });
      } else {
        studentList.forEach(name => { studentAssets[name] = 0; });
        saveData();
      }
    }
    function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(studentAssets)); }
    function resetAllData() {
      if (confirm("정말로 모든 학생의 자산 데이터를 0원으로 초기화하시겠습니까?")) {
        studentList.forEach(name => { studentAssets[name] = 0; });
        saveData(); renderAssetTable(); alert("모든 자산 데이터가 초기화되었습니다.");
      }
    }
    function initStudentSelect() {
      const select = document.getElementById("studentName");
      select.innerHTML = '<option value="" disabled selected>학생 이름을 선택하세요</option>';
      studentList.forEach(name => {
        const option = document.createElement("option"); option.value = name; option.textContent = name; select.appendChild(option);
      });
    }
    function updateCategoryOptions() {
      const type = document.getElementById("transactionType").value;
      const categorySelect = document.getElementById("category");
      categorySelect.innerHTML = '<option value="" disabled selected>상세 항목을 선택하세요</option>';
      categorySelect.disabled = false;
      if (categoryData[type]) {
        categoryData[type].forEach(item => {
          const option = document.createElement("option"); option.value = item; option.textContent = item; categorySelect.appendChild(option);
        });
      }
    }
    function renderAssetTable(filterText = "") {
      const tbody = document.getElementById("assetTableBody"); tbody.innerHTML = ""; let index = 1;
      studentList.forEach(name => {
        if (name.includes(filterText)) {
          const row = document.createElement("tr"); const balance = studentAssets[name] || 0; const isAdmin = name.includes("ADMIN");
          row.innerHTML = \`<td>\${index++}</td><td>\${name} \${isAdmin ? '<span class="admin-tag">관리자</span>' : ''}</td><td class="\${balance >= 0 ? 'amount-plus' : 'amount-minus'}">\${balance.toLocaleString()} 원</td>\`;
          tbody.appendChild(row);
        }
      });
    }
    function filterTable() { renderAssetTable(document.getElementById("searchInput").value.trim()); }
    document.getElementById("assetForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const name = document.getElementById("studentName").value;
      const type = document.getElementById("transactionType").value;
      const category = document.getElementById("category").value;
      const amount = parseInt(document.getElementById("amount").value, 10);
      if (isNaN(amount) || amount <= 0) return;
      if (type === "add") studentAssets[name] += amount;
      else if (type === "subtract") studentAssets[name] -= amount;
      saveData();
      renderAssetTable(document.getElementById("searchInput").value.trim());
      const typeText = type === "add" ? "추가" : "차감";
      const alertBox = document.getElementById("alertBox");
      alertBox.style.display = "block";
      alertBox.innerHTML = \`<strong>[등록 및 저장 완료]</strong><br>\${name} - \${category} (\${typeText}) \${amount.toLocaleString()}원<br><strong>현재 자산: \${studentAssets[name].toLocaleString()}원</strong>\`;
      document.getElementById("assetForm").reset();
      document.getElementById("category").disabled = true;
      document.getElementById("category").innerHTML = '<option value="" disabled selected>구분을 먼저 선택하세요</option>';
    });
  <\/script>
</body>
</html>`;

    // 2. 은행관리 프로그램 (급식 데이터 이미지 정밀 매핑 및 통장 다운로드 수정)

        deleteHeaders.forEach(el => el.style.visibility = 'hidden');

                useCORS: true,
                logging: false
            }).then(canvas => {
                deleteHeaders.forEach(el => el.style.visibility = 'visible');

                const link = document.createElement('a');
                link.download = \`4-4반_통장기록_\${new Date().toISOString().substring(0, 10)}.png\`;

    function promptPasswordAuth(titleText, callback) { document.getElementById('authModalTitle').textContent = titleText; document.getElementById('authPasswordInput').value = ''; document.getElementById('passwordModal').style.display = 'flex'; document.getElementById('authPasswordInput').focus(); pendingAuthCallback = callback; }

    function showUpdateNotice() { const modal = document.getElementById('updateNoticeModal'); if (modal) modal.style.display = 'flex'; }

    function saveRecords(records) { localStorage.setItem('classBankRecords', JSON.stringify(records)); }

    function getDismissedNotifications() { return JSON.parse(localStorage.getItem('dismissedNotifications')) || []; }

    function getWeekKey(dateObj) { const d = new Date(dateObj); d.setHours(0, 0, 0, 0); const day = d.getDay(); const diffToMon = d.getDate() - day + (day === 0 ? -6 : 1); const monday = new Date(d.setDate(diffToMon)); return monday.toISOString().substring(0, 10); }
    function loadRecords() {
        const records = JSON.parse(localStorage.getItem('classBankRecords')) || []; const tbody = document.getElementById('recordList'); tbody.innerHTML = '';
        records.forEach((item, index) => { const formattedAmount = Number(item.amount).toLocaleString() + '원'; const newRow = document.createElement('tr'); newRow.innerHTML = \`<td>\${item.date}</td><td>\${item.name}</td><td>\${item.type}</td><td><strong>\${formattedAmount}</strong></td><td><button class="delete-btn" onclick="deleteRecord(\${index})">삭제</button></td>\`; tbody.appendChild(newRow); });

            let depositTotal = 0, savingsTotal = 0;
            records.forEach(item => { if (item.name === name) { const amt = Number(item.amount) || 0; if (item.type === '정기예금') depositTotal += amt; if (item.type === '정기적금') savingsTotal += amt; } });
            const totalAmount = depositTotal + savingsTotal;

            const savingsBadge = savingsTotal > 0 ? \`<span class="badge-status badge-done">완료 (\${savingsTotal.toLocaleString()}원)</span>\` : \`<span class="badge-status badge-none">미완료</span>\`;

    function updateNotifications() {
        const records = JSON.parse(localStorage.getItem('classBankRecords')) || []; const notificationList = document.getElementById('notificationList'); notificationList.innerHTML = ''; const dismissed = getDismissedNotifications(); const savingsDataMap = {};
        records.forEach(item => { if (item.type === '정기적금' && Number(item.amount) === 200) { if (!savingsDataMap[item.name]) savingsDataMap[item.name] = { count: 0, lastDate: item.date }; savingsDataMap[item.name].count += 1; if (item.date > savingsDataMap[item.name].lastDate) savingsDataMap[item.name].lastDate = item.date; } });
        let hasTarget = false;
        Object.keys(savingsDataMap).forEach(name => {
            if (savingsDataMap[name].count >= 3 && !dismissed.includes(name)) {
                hasTarget = true; const lastDateObj = new Date(savingsDataMap[name].lastDate); const returnDateObj = new Date(lastDateObj); returnDateObj.setDate(lastDateObj.getDate() + 7);
                const weekNames = ['일', '월', '화', '수', '목', '금', '토']; const returnDateStr = \`\${returnDateObj.getMonth() + 1}월 \${returnDateObj.getDate()}일(\${weekNames[returnDateObj.getDay()]})\`;
                const li = document.createElement('li'); li.className = 'notification-item'; li.innerHTML = \`<span>🎉 <strong>\${name}</strong> 학생 적금 만기! 다음 주 <strong>\${returnDateStr}</strong>에 <strong>800원</strong>으로 돌려받게 됩니다.</span><button class="notification-del-btn" onclick="dismissNotification('\${name}')">✕ 닫기</button>\`; notificationList.appendChild(li);
            }
        });
        if (!hasTarget) notificationList.innerHTML = '<li class="empty-notification">현재 표시할 적금 반환 알림이 없습니다.</li>';

    function switchPeriod(period, btnElement) { currentPeriod = period; document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active')); btnElement.classList.add('active'); updateLeaderboards(); }
    function filterRecordsByPeriod(records, period) {
        const today = new Date(); const todayStr = today.toISOString().substring(0, 10);
        return records.filter(item => { if (!item.date) return false; const itemDate = new Date(item.date); if (period === 'today') return item.date === todayStr; if (period === 'week') return getWeekKey(itemDate) === getWeekKey(today); if (period === 'month') return itemDate.getFullYear() === today.getFullYear() && itemDate.getMonth() === today.getMonth(); return true; });
    }
    function updateLeaderboards() {
        const records = JSON.parse(localStorage.getItem('classBankRecords')) || []; const filtered = filterRecordsByPeriod(records, currentPeriod);
        const depositMap = {}, savingsMap = {}, totalMap = {};
        filtered.forEach(item => { const amt = Number(item.amount) || 0; totalMap[item.name] = (totalMap[item.name] || 0) + amt; if (item.type === '정기예금') depositMap[item.name] = (depositMap[item.name] || 0) + amt; else if (item.type === '정기적금') savingsMap[item.name] = (savingsMap[item.name] || 0) + amt; });
        renderRankList('depositRankList', depositMap); renderRankList('savingsRankList', savingsMap); renderRankList('totalRankList', totalMap);
    }
    function renderRankList(elementId, dataMap) {
        const listEl = document.getElementById(elementId); listEl.innerHTML = '';
        const sorted = Object.keys(dataMap).map(name => ({ name, amount: dataMap[name] })).sort((a, b) => b.amount - a.amount).slice(0, 10);
        if (sorted.length === 0) { listEl.innerHTML = '<li class="empty-rank">기록이 없습니다.</li>'; return; }
        sorted.forEach((item, index) => {
            const rankClass = index === 0 ? 'rank-1' : index === 1 ? 'rank-2' : index === 2 ? 'rank-3' : '';
            const li = document.createElement('li'); li.className = 'rank-item'; li.innerHTML = \`<span><span class="rank-number \${rankClass}">\${index + 1}.</span> <span class="\${rankClass}">\${item.name}</span></span><strong>\${item.amount.toLocaleString()}원</strong>\`; listEl.appendChild(li);
        });

    function addRecord() {
        const dateInput = document.getElementById('date').value; const name = document.getElementById('name').value; const amount = Number(document.getElementById('amount').value); const type = document.getElementById('type').value;
        if (!dateInput || !name || !amount || amount <= 0) { alert('날짜, 이름, 올바른 금액을 선택/입력해 주세요!'); return; }
        const isSuperAdmin = (name === SUPER_ADMIN_NAME); const adminSettings = getAdminSettings(); const userSetting = adminSettings[name] || {};
        if (!isSuperAdmin) { if (type === '정기예금' && userSetting.blockDeposit) { alert(\`[접근 제한] '\${name}' 대원은 '정기예금'이 금지되어 있습니다.\`); return; } if (type === '정기적금' && userSetting.blockSavings) { alert(\`[접근 제한] '\${name}' 대원은 '정기적금'이 금지되어 있습니다.\`); return; } }
        const records = JSON.parse(localStorage.getItem('classBankRecords')) || [];
        if (type === '정기예금' && !isSuperAdmin) {
            if (amount > 1000) { alert('[경고] 정기예금은 1회에 최대 1,000원까지만 가능합니다!'); return; }
            const currentDepositTotal = records.filter(item => item.name === name && item.type === '정기예금').reduce((sum, item) => sum + Number(item.amount), 0);
            if (!userSetting.unlimitDeposit && (currentDepositTotal + amount > 3000)) { alert(\`[경고] 정기예금 총 한도는 3,000원입니다.\`); return; }
        }
        if (type === '정기적금' && !isSuperAdmin) {
            if (amount > 200) { alert('[경고] 정기적금은 1회에 최대 200원까지만 가능합니다!'); return; }
            const inputWeekKey = getWeekKey(new Date(dateInput));
            if (records.some(item => item.name === name && item.type === '정기적금' && getWeekKey(new Date(item.date)) === inputWeekKey)) { alert(\`[경고] 이번 주에 이미 정기적금을 넣었습니다!\`); return; }
        }
        records.unshift({ date: dateInput, name: name, amount: amount, type: type }); saveRecords(records); loadRecords(); updateStudentStatusTable(); updateLeaderboards(); updateNotifications();
        document.getElementById('amount').value = ''; document.getElementById('name').value = '';
    }
    function deleteRecord(index) {
        if (confirm('이 기록을 삭제하시겠습니까?')) {
            const records = JSON.parse(localStorage.getItem('classBankRecords')) || []; const deleted = records.splice(index, 1)[0];
            const deletedRecords = getDeletedRecords(); deletedRecords.unshift(deleted); saveDeletedRecords(deletedRecords);
            saveRecords(records); loadRecords(); updateStudentStatusTable(); updateLeaderboards(); updateNotifications();
        }
    }
    function clearAllRecords() {
        promptPasswordAuth('🔑 전체 삭제 비밀번호 입력', function() {
            if (confirm('모든 통장 기록을 지우시겠습니까?')) {
                const records = JSON.parse(localStorage.getItem('classBankRecords')) || []; const deletedRecords = getDeletedRecords();

    function modifyStudentBalance(action) {
        const name = document.getElementById('adminStudentSelect').value; const adminDate = document.getElementById('adminDate').value; const type = document.getElementById('editType').value; const amount = Number(document.getElementById('editAmount').value);
        if (!name || !adminDate || !amount || amount <= 0) { alert('학생, 날짜, 올바른 금액을 입력해 주세요!'); return; }
